<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Login | Ekleans</title>
    <link rel="stylesheet" href="css/admin-auth.css" />
  </head>
  <body class="admin-auth-page">
    <div class="auth-wrapper">
      <div class="auth-header">
        <div class="auth-icon">✨</div>
        <h2>Client Dashboard Login</h2>
        <p id="authSubtitle">
          Enter your email to receive a secure access code
        </p>
      </div>

      <div class="auth-card">
        <form id="requestTokenForm">
          <div class="form-group">
            <div class="form-header">
              <label for="clientEmail">Email Address</label>
            </div>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input
                type="email"
                id="clientEmail"
                class="form-control"
                placeholder="you@email.com"
                required
              />
            </div>
          </div>
          <button type="submit" class="btn-primary">Send Login Code</button>
        </form>

        <form id="verifyTokenForm" style="display: none">
          <div class="form-group">
            <div class="form-header">
              <label for="loginCode">6-Digit Access Code</label>
            </div>
            <div class="input-wrapper">
              <span class="input-icon">🔑</span>
              <input
                type="text"
                id="loginCode"
                class="form-control"
                placeholder="123456"
                maxlength="6"
                required
              />
            </div>
          </div>
          <button type="submit" class="btn-primary">Verify & Sign In</button>
        </form>
      </div>

      <div style="text-align: center; margin-top: 1.5rem">
        <a href="index.html" class="forgot-link">← Back to Homepage</a>
      </div>

      <div class="auth-footer">Ekleans Industrial © 2026 — Client Portal</div>
    </div>

    <script src="js/client-auth.js"></script>
  </body>
</html>
