<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Login | Ekleans</title>
    <link rel="stylesheet" href="css/admin-auth.css" />
  </head>
  <body class="admin-auth-page">
    <div class="auth-wrapper">
      <div class="auth-header">
        <div class="auth-icon">✨</div>
        <h2>Client Dashboard Login</h2>
        <p>Sign in to manage your cleaning schedules</p>
      </div>

      <div class="auth-card">
        <form id="clientLoginForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input
                type="email"
                id="email"
                class="form-control"
                placeholder="you@email.com"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔑</span>
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter password"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn-primary">Sign In</button>
        </form>
      </div>

      <div style="text-align: center; margin-top: 1.5rem">
        <a href="index.html" class="forgot-link">← Back to Homepage</a>
      </div>
      <div class="auth-footer">Ekleans Industrial © 2026 — Client Portal</div>
    </div>
    <script src="js/client-login.js"></script>
  </body>
</html>
