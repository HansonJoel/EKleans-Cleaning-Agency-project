<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Your Account | Ekleans</title>
    <link rel="stylesheet" href="css/admin-auth.css" />
  </head>
  <body class="admin-auth-page">
    <div class="auth-wrapper">
      <div class="auth-header">
        <div class="auth-icon">🔒</div>
        <h2>Secure Your Account</h2>
        <p>Create a password to track your booking on your dashboard.</p>
      </div>

      <div class="auth-card">
        <form id="setPasswordForm">
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔑</span>
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Choose a strong password"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔄</span>
              <input
                type="password"
                id="confirmPassword"
                class="form-control"
                placeholder="Repeat your password"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn-primary">
            Create Password & View Dashboard
          </button>
        </form>
      </div>
    </div>
    <script src="js/set-password.js"></script>
  </body>
</html>
