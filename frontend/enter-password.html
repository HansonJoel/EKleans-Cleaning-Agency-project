<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Booking | Ekleans</title>
    <link rel="stylesheet" href="css/admin-auth.css" />
  </head>
  <body class="admin-auth-page">
    <div class="auth-wrapper">
      <div class="auth-header">
        <div class="auth-icon">🔑</div>
        <h2>Welcome Back!</h2>
        <p>
          Please enter your password to confirm this booking and view your
          dashboard.
        </p>
      </div>

      <div class="auth-card">
        <form id="enterPasswordForm">
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter your password"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn-primary">
            Verify & Confirm Booking
          </button>
        </form>
      </div>
    </div>
    <script src="js/enter-password.js"></script>
  </body>
</html>
